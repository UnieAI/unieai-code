provenance:
  parent: cc2e1c875185
  edits:
  - op: enable_plugin
    args:
      plugin: unieai-loop-guard
    rationale: A mechanical loop detector interrupts the repeated-call pattern that inflates turn counts
      and burns the time budget, instead of relying on the model to notice it is stuck.
    scope: invariant
    cue: 10/41 failing runs repeated one identical tool call >=5 times (max x18); median 88 tool calls
      vs 12 in passing runs
  - op: set_tool_guidance
    args:
      tool: exec_command
      text: 'Always bound commands: set yield_time_ms and wrap risky runs in `timeout N`. Prefer targeted
        tests/files over full suites; run the full suite at most once, near the end. Redirect verbose
        output to a file and tail it. If a background session is still running after one poll, do other
        work or kill it — do not poll it repeatedly.'
    rationale: Caps the wall-clock cost of individual commands and stops the poll-until-done pattern that
      dominates time-limited failures.
    scope: invariant
    cue: Longest waits of 30-60s per call, repeated write_stdin polling, and full-suite/coverage reruns
      consumed the budget in time-limited runs
  - op: add_persona_line
    args:
      text: 'Watch for repetition: if a call fails or returns the same output twice, do not retry it —
        re-read the file, narrow the command, or switch tools. Budget time: prefer targeted checks over
        full-suite reruns, and stop once the requirement is verified rather than polishing.'
    rationale: Makes self-detection of stalls and time budgeting an explicit behavior, so the agent changes
      approach or wraps up instead of grinding through near-identical calls until timeout.
    scope: invariant
    cue: 17/41 runs hit the agent time limit and 10/41 looped; failing runs use ~6x the turns of passing
      ones
