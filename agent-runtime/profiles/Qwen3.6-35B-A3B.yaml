tool_guidance:
- tool: exec_command
  text: 'Always bound commands: set yield_time_ms and wrap risky runs in `timeout N`. Prefer targeted
    tests/files over full suites; run the full suite at most once, near the end. Redirect verbose output
    to a file and tail it. If a background session is still running after one poll, do other work or kill
    it — do not poll it repeatedly.'
