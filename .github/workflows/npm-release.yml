name: npm-release

# Builds the codex-rs CLI for every npm-supported platform, stages the
# @unieai/code npm packages, and publishes them to the npm registry.
#
# npm layout (see codex-cli/scripts/build_npm_package.py):
#   @unieai/code@<version>             root launcher (bin/codex.js), takes `latest`
#   @unieai/code@<version>-<platform>  per-platform binary payloads, referenced by
#                                      the root package's optionalDependencies via
#                                      npm aliases (@unieai/code-<platform>)
#
# Platform payloads must be published BEFORE the root package so that the
# aliases resolve the moment `latest` moves.
#
# Version semantics: the npm version comes from the tag (npm-v0.0.16 -> 0.0.16)
# or the workflow_dispatch input. The in-tree Cargo workspace version is the
# internal build id (e.g. 0.0.16-dev-uc0.4.0-ac0.2.0) and is intentionally NOT
# overwritten — it is what `unieai --version` reports.
#
# Publishing uses npm trusted publishing (OIDC), not a token: @unieai/code on
# npmjs.com lists this repository and `npm-release.yml` as its trusted
# publisher, with direct `npm publish` allowed. It needs npm >= 11.5.1 and
# `id-token: write` on the publish job. An `NPM_TOKEN` secret, when set, is a
# fallback npm uses only if the OIDC exchange fails.
# Tag pushes always publish. workflow_dispatch publishes only when the
# `publish` input is true; otherwise the tarballs are just uploaded as a
# workflow artifact for inspection or manual `npm publish`.

on:
  push:
    tags: ['npm-v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version to stage (e.g. 0.0.16)'
        required: true
        type: string
      publish:
        description: 'Publish to npm (trusted publishing); off = artifacts only'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every release needs a CHANGELOG.md entry ("## <version> — <date>"); see the
  # comment at the top of CHANGELOG.md and scripts/unieai_changelog_draft.py.
  # A run that publishes (tag push, or workflow_dispatch with publish) fails
  # here before anything is built; an artifacts-only dispatch only warns.
  changelog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Require a CHANGELOG.md entry for this version
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          PUBLISHING: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#npm-v}"
          version_re="${VERSION//./\\.}"
          if grep -qE "^## \[?${version_re}\]?([[:space:]]|$)" CHANGELOG.md; then
            echo "CHANGELOG.md has an entry for ${VERSION}."
            exit 0
          fi
          msg="CHANGELOG.md has no '## ${VERSION}' section. Draft one with 'python3 scripts/unieai_changelog_draft.py --version ${VERSION}', edit it for users, commit it, and push the tag again on that commit."
          if [ "$PUBLISHING" = "true" ]; then
            echo "::error file=CHANGELOG.md::${msg}"
            exit 1
          fi
          echo "::warning file=CHANGELOG.md::${msg} (not publishing, so not failing)"

  build:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Since the 2026-10-17 upstream merge the musl builds outgrow the
      # hosted Linux runners: in npm-v0.0.35 both were killed (exit 143)
      # 16-18 minutes into `cargo build`. Give them swap and the disk that
      # preinstalled toolchains hold.
      - name: Make room on the Linux runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          swapfile=/unieai-swap
          if [[ -d /mnt ]] && sudo fallocate -l 16G /mnt/unieai-swap 2>/dev/null; then
            swapfile=/mnt/unieai-swap
          else
            sudo fallocate -l 16G "$swapfile"
          fi
          sudo chmod 600 "$swapfile"
          sudo mkswap "$swapfile"
          sudo swapon "$swapfile"
          free -h
          df -h /

      - name: Resolve npm version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#npm-v}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # The in-tree workspace version is the internal build id (e.g.
      # 0.0.17-dev-uc0.4.0-ac0.2.0) for dev builds only. Released binaries
      # report the clean npm version, so stamp it before building.
      - name: Stamp workspace version
        shell: bash
        run: |
          # Windows runners check out with CRLF, so the newline is \r?\n; an
          # unmatched pattern once shipped every Windows build as the dev id.
          perl -0pi -e 's/\[workspace\.package\](\r?\n)version = "[^"]*"/[workspace.package]$1version = "${{ steps.version.outputs.value }}"/' Cargo.toml
          grep -A1 '^\[workspace.package\]' Cargo.toml | head -2
          perl -0ne 'exit(/\[workspace\.package\]\r?\nversion = "\Q${{ steps.version.outputs.value }}\E"/ ? 0 : 1)' Cargo.toml || { echo "::error::Cargo.toml version was not stamped"; exit 1; }

      - name: Install Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install Zig (musl)
        if: contains(matrix.target, 'musl')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: contains(matrix.target, 'musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"
          # aws-lc's jitter entropy path is problematic on musl builders.
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          no_jitter_var="AWS_LC_SYS_NO_JITTER_ENTROPY_${TARGET//-/_}"
          echo "${no_jitter_var}=1" >> "$GITHUB_ENV"

      # openai/codex only publishes custom rusty_v8 artifacts for mac/linux
      # (musl needs them; denoland ships no musl prebuilts). On Windows the
      # v8 crate's build.rs downloads the official denoland prebuilt instead.
      - name: Configure rusty_v8 artifact overrides and verify checksums
        if: ${{ !contains(matrix.target, 'windows') }}
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Expose MSVC developer environment
        if: contains(matrix.target, 'windows')
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ matrix.target }}

      - name: Cargo build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "x86_64-pc-windows-msvc" ]]; then
            export LIBSQLITE3_FLAGS=SQLITE_DISABLE_INTRINSIC
          fi
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            # Leave a trace of memory and disk if the runner dies again.
            (while sleep 60; do echo "::group::resources $(date -u +%T)"; free -m; df -h / | tail -1; echo "::endgroup::"; done) &
            export CARGO_BUILD_JOBS=$(( $(nproc) > 2 ? $(nproc) - 1 : $(nproc) ))
          fi
          cargo build --release --target ${{ matrix.target }} --bin codex

      # Unstripped linux binaries are ~1.2GB (debug = "line-tables-only") and
      # their tarballs exceed the npm registry size limit (HTTP 413).
      - name: Strip binary
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/codex"
          case "${{ matrix.target }}" in
            *linux*)
              strip --strip-unneeded "$exe"
              ;;
            *darwin*)
              strip -Sx "$exe"
              codesign -s - -f "$exe"
              ;;
            *windows*)
              # MSVC debug info lives in the separate PDB; nothing to strip.
              ;;
          esac

      - name: Stage binary
        shell: bash
        run: |
          exe_suffix=""
          case "${{ matrix.target }}" in
            *windows*) exe_suffix=".exe" ;;
          esac
          mkdir -p "../npm-vendor/${{ matrix.target }}/bin"
          cp "target/${{ matrix.target }}/release/codex${exe_suffix}" \
             "../npm-vendor/${{ matrix.target }}/bin/codex${exe_suffix}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-vendor-${{ matrix.target }}
          path: npm-vendor
          if-no-files-found: error

  stage:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve npm version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in
              npm-v*.*.*) ;;
              *) echo "::error::Tag '$TAG' does not match npm-vX.Y.Z"; exit 1 ;;
            esac
            VERSION="${TAG#npm-v}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: npm-vendor-*
          path: npm-vendor
          merge-multiple: true

      - name: Stage npm tarballs
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # Artifact zips drop the exec bit; restore it before npm pack
          # records file modes into the tarballs.
          find npm-vendor -type f -path '*/bin/codex*' -exec chmod +x {} +
          find npm-vendor -type f | sort
          mkdir -p dist/npm

          python3 codex-cli/scripts/build_npm_package.py \
            --package codex \
            --release-version "$VERSION" \
            --pack-output "dist/npm/codex-npm-${VERSION}.tgz"

          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            python3 codex-cli/scripts/build_npm_package.py \
              --package "codex-${platform}" \
              --release-version "$VERSION" \
              --vendor-src npm-vendor \
              --pack-output "dist/npm/codex-npm-${platform}-${VERSION}.tgz"
          done
          ls -lh dist/npm

      - name: Smoke test (linux-x64 payload through the launcher)
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          mkdir -p "$smoke/payload"
          tar -xzf "dist/npm/codex-npm-${VERSION}.tgz" -C "$smoke"
          tar -xzf "dist/npm/codex-npm-linux-x64-${VERSION}.tgz" -C "$smoke/payload"
          # The launcher falls back to <package-root>/vendor when the platform
          # alias package is not installed.
          cp -R "$smoke/payload/package/vendor" "$smoke/package/vendor"
          chmod +x "$smoke"/package/vendor/*/bin/codex
          node "$smoke/package/bin/codex.js" --version

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs-${{ steps.version.outputs.value }}
          path: dist/npm/*.tgz
          if-no-files-found: error

  publish:
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # npm trusted publishing
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # No registry-url: it writes an .npmrc with a placeholder token that
          # npm would send instead of the OIDC exchange.

      - name: Download npm tarballs
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs-${{ needs.stage.outputs.version }}
          path: dist/npm

      - name: Publish to npm
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.stage.outputs.version }}
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -1)" != 11.5.1 ]; then
            npm install -g npm@11
          fi
          echo "npm $(npm --version)"
          # Fallback while trusted publishing is not configured: npm tries the
          # OIDC exchange first and uses this token only when that fails.
          if [ -n "${NPM_TOKEN}" ]; then
            echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > "$HOME/.npmrc"
          fi

          publish_one() {
            local tarball="$1" tag="$2"
            local cmd=(npm publish "$tarball" --access public)
            if [ -n "$tag" ]; then
              cmd+=(--tag "$tag")
            fi
            echo "+ ${cmd[*]}"
            set +e
            local output
            output="$("${cmd[@]}" 2>&1)"
            local status=$?
            set -e
            echo "$output"
            if [ $status -ne 0 ]; then
              if grep -qiE "previously published|cannot publish over|version already exists" <<< "$output"; then
                echo "Skipping already-published version in $tarball"
              else
                exit $status
              fi
            fi
          }

          # Platform payloads first: the root package advances `latest` as soon
          # as it publishes, and its optionalDependencies aliases must already
          # resolve at that point. Publishing is serial on purpose — every
          # tarball is a version of the same @unieai/code packument and npm
          # returns 409 on concurrent packument updates.
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            publish_one "dist/npm/codex-npm-${platform}-${VERSION}.tgz" "$platform"
          done
          publish_one "dist/npm/codex-npm-${VERSION}.tgz" ""

          # npm has reported a publish as succeeding while the registry kept no
          # such version: 0.0.30-darwin-x64 printed its usual "+ @unieai/code@..."
          # line and never existed. The root package's optionalDependencies pin
          # that exact version, so one lost platform means every user on it
          # installs a `latest` whose binary cannot resolve -- and the run is
          # green, so nothing says so. Read the registry back and fail if a
          # version we just published is not there.
          # The registry is eventually consistent: a version published seconds
          # ago is routinely not yet visible to a read, and the first cut of
          # this check called all seven missing while six of them turned up
          # over the following minutes. Retry with a widening gap, and only
          # call a version lost when it has not appeared in about fifteen:
          # 0.0.35-linux-x64 took longer than five on a rerun and was there.
          missing=("$VERSION")
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            missing+=("${VERSION}-${platform}")
          done
          for wait in 10 20 30 60 60 90 120 120 120 120 120; do
            sleep "$wait"
            remaining=()
            for expected in "${missing[@]}"; do
              if ! npm view "@unieai/code@${expected}" version --prefer-online >/dev/null 2>&1; then
                remaining+=("$expected")
              fi
            done
            missing=("${remaining[@]}")
            [ ${#missing[@]} -eq 0 ] && break
            echo "not visible yet: ${missing[*]}"
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::published but absent from the registry: ${missing[*]}"
            exit 1
          fi

          npm view @unieai/code dist-tags

  # Offline install bundles (scripts/unieai_offline_bundle.py): per platform,
  # the installed npm package with the uac engine's dependencies and Node.js,
  # attached to the GitHub Release for this version. Built on one Linux
  # runner: npm installs another platform's native packages with --os/--cpu.
  offline:
    needs: stage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download npm tarballs
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs-${{ needs.stage.outputs.version }}
          path: dist/npm

      - name: Build offline bundles
        shell: bash
        env:
          VERSION: ${{ needs.stage.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/unieai_offline_bundle.py --version "$VERSION" --npm-dir dist/npm --out dist/offline
          rm -rf dist/offline/.cache
          ls -lh dist/offline

      - name: Smoke test (linux-x64 bundle installs and runs with no network)
        shell: bash
        env:
          VERSION: ${{ needs.stage.outputs.version }}
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          tar -xzf "dist/offline/unieai-code-${VERSION}-linux-x64.tar.gz" -C "$smoke"
          docker run --rm --network none -v "$smoke:/b:ro" ubuntu:24.04 sh -c "
            cp -r /b/unieai-code-${VERSION}-linux-x64 /tmp/x && HOME=/root sh /tmp/x/install.sh &&
            /root/.local/bin/unieai --version &&
            /root/.local/share/unieai-code/${VERSION}/node/bin/node \
              /root/.local/share/unieai-code/${VERSION}/package/node_modules/@deepseek-ai/dsh/lib/bin.js --version"

      - name: Attach to the GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.stage.outputs.version }}
        run: |
          set -euo pipefail
          tag="npm-v${VERSION}"
          assets=(dist/offline/*.tar.gz dist/offline/*.zip dist/offline/*SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
              --title "UnieAI Code ${VERSION}" \
              --notes "npm: \`npm install -g @unieai/code@${VERSION}\`. Offline: download the bundle for your platform and run \`sh install.sh\` (Windows: \`install.ps1\`); it carries Node.js and every dependency."
          fi
